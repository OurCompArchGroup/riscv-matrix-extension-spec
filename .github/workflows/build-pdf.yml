name: Build PDF Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'spec/**'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'spec/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify workspace layout
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/spec"

      - name: Pull RISC-V Docs container image
        run: docker pull riscvintl/riscv-docs-base-container-image:latest

      - name: Build PDF
        run: |
          if [ -f "$GITHUB_WORKSPACE/spec/Makefile" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo/spec \
              riscvintl/riscv-docs-base-container-image:latest \
              /bin/sh -c 'make'
          elif [ -f "$GITHUB_WORKSPACE/Makefile" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
              riscvintl/riscv-docs-base-container-image:latest \
              /bin/sh -c 'make'
          else
            echo "Makefile not found in spec/ or repository root."
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-zames-specification-proposal
          path: spec/*.pdf
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-${{ github.sha }}
          name: Latest Build
          files: spec/*.pdf
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
