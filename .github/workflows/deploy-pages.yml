name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'spec/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'spec/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PDF and HTML
        run: |
          docker run --rm -v "$(pwd)":/repo -w /repo/spec \
            riscvintl/riscv-docs-base-container-image:latest \
            /bin/sh -c 'make build-no-container && make build-html-no-container'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-zames-specification-proposal
          path: spec/*.pdf
          retention-days: 30

      - name: Prepare Pages directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist/spec
          cp spec/riscv_zames_specification_proposal.html dist/spec/index.html
          cp -r spec/images dist/spec/images
          [ -f spec/riscv_zames_specification_proposal.pdf ] && cp spec/riscv_zames_specification_proposal.pdf dist/spec/

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
