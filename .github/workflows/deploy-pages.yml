name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'spec/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'spec/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify workspace layout
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/spec"

      - name: Diagnose PDF table overflow
        run: |
          cat > "$GITHUB_WORKSPACE/spec/.probe-template.adoc" <<'EOF'
          :description: Probe
          :company: Probe
          :revdate: 2026-04-05
          :doctype: book
          :preface-title: Preamble
          :appendix-caption: Appendix
          :imagesdir: images
          :experimental:
          :docinfo: shared
          :reproducible:
          :bibtex-file: example.bib
          :bibtex-order: alphabetical
          :bibtex-style: apa
          :icons: font
          :lang: en
          :listing-caption: Listing
          :sectnums:
          :toc: left
          :toclevels: 4
          :source-highlighter: pygments
          :data-uri:
          :hide-uri-scheme:
          :stem: latexmath
          :footnote:
          :xrefstyle: short

          = Probe

          include::__TARGET__[]
          EOF

          failed=0
          for f in \
            intro.adoc \
            param.adoc \
            program_model.adoc \
            inst_format.adoc \
            instructions.adoc \
            mem_model.adoc \
            instruction_list.adoc \
            zmasync_appendix.adoc \
            proposals.adoc
          do
            echo "=== PROBE $f ==="
            sed "s|__TARGET__|$f|g" "$GITHUB_WORKSPACE/spec/.probe-template.adoc" > "$GITHUB_WORKSPACE/spec/.probe.adoc"

            if ! docker run --rm -v "$GITHUB_WORKSPACE":/repo -v /tmp:/tmp -w /repo/spec \
              riscvintl/riscv-docs-base-container-image:latest \
              /bin/sh -c "asciidoctor-pdf --trace \
                -a compress \
                -a mathematical-format=svg \
                -a scripts=cjk \
                -a revdate=2026-04-05 \
                -a pdf-fontsdir=docs-resources/fonts,../doc/resources/fonts \
                -a pdf-theme=riscv-matrix.yml \
                --failure-level=ERROR \
                --require=asciidoctor-bibtex \
                --require=asciidoctor-diagram \
                --require=asciidoctor-mathematical \
                --out-file=/tmp/$(basename "$f" .adoc).pdf \
                /repo/spec/.probe.adoc" >"/tmp/${f}.log" 2>&1
            then
              echo "::error file=spec/$f::Probe failed for $f"
              cat "/tmp/${f}.log"
              failed=1
            fi
          done

          rm -f "$GITHUB_WORKSPACE/spec/.probe-template.adoc" "$GITHUB_WORKSPACE/spec/.probe.adoc"

          exit $failed

      - name: Build PDF and HTML
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo/spec \
            riscvintl/riscv-docs-base-container-image:latest \
            /bin/sh -c 'make build-no-container && make build-html-no-container'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-zames-specification-proposal
          path: spec/*.pdf
          retention-days: 30

      - name: Prepare Pages directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist/spec
          cp spec/riscv_zames_specification_proposal.html dist/spec/index.html
          cp -r spec/images dist/spec/images
          [ -f spec/riscv_zames_specification_proposal.pdf ] && cp spec/riscv_zames_specification_proposal.pdf dist/spec/

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
