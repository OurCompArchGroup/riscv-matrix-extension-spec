<style>
#toc.toc2 {
  position: fixed;
  width: 20em;
  overflow-y: auto;
  top: 0;
  bottom: 0;
  z-index: 100;
  background: #f8f8f7;
  border-right: 1px solid #e0e0dc;
  transition: left 0.3s ease;
}
#toc.toc2.hidden {
  left: -20em;
}
body.toc2 {
  padding-left: 20em;
  transition: padding-left 0.3s ease;
}
body.toc2.toc-hidden {
  padding-left: 0;
}
#toc-toggle {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 200;
  cursor: pointer;
  background: #7a2518;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 14px;
}
body.toc2:not(.toc-hidden) #toc-toggle {
  left: calc(20em + 8px);
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toc = document.getElementById('toc');
  if (!toc) return;
  var btn = document.createElement('button');
  btn.id = 'toc-toggle';
  btn.textContent = '☰';
  btn.title = 'Toggle TOC';
  document.body.prepend(btn);
  btn.addEventListener('click', function() {
    toc.classList.toggle('hidden');
    document.body.classList.toggle('toc-hidden');
  });
});
</script>
